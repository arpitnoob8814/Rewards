<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards Hub</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #5f2c82, #49a09d);
  color: #fff;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: 40px auto;
  background: #ffffff;
  color: #333;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  margin-bottom: 5px;
}

.sub {
  font-size: 14px;
  color: #666;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.card {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  border-radius: 15px;
  padding: 15px;
  cursor: pointer;
  transition: 0.25s;
}

.card:nth-child(2) {
  background: linear-gradient(135deg, #a18cd1, #fbc2eb);
}

.card:nth-child(3) {
  background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
}

.card:nth-child(4) {
  background: linear-gradient(135deg, #84fab0, #8fd3f4);
}

.card:hover {
  transform: scale(1.05);
}

.icon {
  font-size: 30px;
}

.title {
  font-weight: bold;
  margin-top: 5px;
}

.desc {
  font-size: 12px;
}

.footer {
  margin-top: 15px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<div class="container">
  <h2>🎁 Choose Your Option</h2>
  <p class="sub">Explore tools, apps & offers</p>

  <div class="grid">

    <div class="card" onclick="go('link1')">
      <div class="icon">🤖</div>
      <div class="title">AI Tool</div>
      <div class="desc">Try a powerful AI tool</div>
    </div>

    <div class="card" onclick="go('link2')">
      <div class="icon">🎮</div>
      <div class="title">Gaming Apps</div>
      <div class="desc">Discover useful apps</div>
    </div>

    <div class="card" onclick="go('link3')">
      <div class="icon">💸</div>
      <div class="title">Earn App</div>
      <div class="desc">Explore earning platforms</div>
    </div>

    <div class="card" onclick="go('link4')">
      <div class="icon">🌐</div>
      <div class="title">Web Tools</div>
      <div class="desc">Cool hidden websites</div>
    </div>

  </div>

  <div class="footer">
    Some options may require signup or trial. No guarantees of rewards.
  </div>
</div>

<script>
function go(link) {
  const links = {
    link1: "https://rainawards.com/ow/69e5be8a1fbeba4b47b3ef32",
    link2: "https://rainawards.com/ow/69e5be8a1fbeba4b47b3ef32",
    link3: "https://rainawards.com/ow/69e5be8a1fbeba4b47b3ef32",
    link4: "https://rainawards.com/ow/69e5be8a1fbeba4b47b3ef32"
  };
  window.location.href = links[link];
}
</script>

</body>
</html>
